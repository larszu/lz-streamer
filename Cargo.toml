[package]
name = "lz-streamer"
version = "0.1.0"
edition = "2024"
description = "Eigener Video-Encoder/Decoder: Eingang -> Encoder -> SRT/RTMP, Rust + GStreamer"
publish = false

[lib]
name = "lz_streamer"
path = "src/lib.rs"

[[bin]]
name = "lz-streamer"
path = "src/main.rs"

[dependencies]
deep-filter-rt = "0.1.1"
ndarray = "0.17"
vst3-host = { version = "0.11", default-features = false }
anyhow = "1.0.104"
base64 = "0.22"
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
getrandom = "0.2"
futures-util = "0.3"
rosc = "0.11"
rustfft = "6"
rand_core = { version = "0.6", features = ["getrandom"] }
sysinfo = "0.39.6"
gstreamer = { version = "0.25.4", features = ["v1_22"] }
gstreamer-app = "0.25.2"
gstreamer-base = "0.25"
gstreamer-video = { version = "0.25", features = ["v1_22"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls-tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
gstreamer-app = "0.25.2"

# DeepFilterNet läuft im Debug-Bau sonst ≈ 10× langsamer (Tests in Echtzeit)
[profile.dev.package."*"]
opt-level = 2
